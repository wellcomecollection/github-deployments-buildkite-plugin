name: GitHub Deployments
description: For creating and managing GitHub Deployments
author: https://github.com/wellcomecollection
requirements: []
configuration:
  properties:
    environment:
      type: string
    ref:
      type: string
    assume_role:
      type: string
    task:
      type: string
    status:
      type: string
      enum:
        - in_progress
        - success
        - failure
    deployment_id:
      type: string
    environment_url:
      type: string
    log_url:
      type: string
    description:
      type: string
    wrap:
      type: boolean
  additionalProperties: false
